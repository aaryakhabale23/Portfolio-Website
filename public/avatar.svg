<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f2e"/>
      <stop offset="50%" stop-color="#161622"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="50%" stop-color="#3EA6FF"/>
      <stop offset="100%" stop-color="#FF0033"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#avatarGrad)"/>
  
  <!-- Outer Accent Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" opacity="0.9"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#222230" stroke-width="1.5"/>

  <!-- Inner Soft Glow -->
  <circle cx="120" cy="120" r="80" fill="url(#glow)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.15">
    <line x1="60" y1="120" x2="180" y2="120" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="120" y1="60" x2="120" y2="180" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="120" cy="120" r="50" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Stylized Avatar Silhouette / Monogram -->
  <g transform="translate(120, 120)">
    <!-- Tech node accents -->
    <circle cx="-50" cy="-30" r="3.5" fill="#3EA6FF"/>
    <circle cx="50" cy="-30" r="3.5" fill="#FF0033"/>
    <circle cx="0" cy="-60" r="4" fill="#F1F1F1"/>
    <line x1="-50" y1="-30" x2="0" y2="-60" stroke="#3EA6FF" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="-30" x2="0" y2="-60" stroke="#FF0033" stroke-width="1" opacity="0.4"/>

    <!-- Prominent Professional Monogram "AK" -->
    <text x="0" y="22" font-family="Roboto, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#F1F1F1" text-anchor="middle" letter-spacing="4">
      AK
    </text>
    
    <!-- Subtitle badge below -->
    <rect x="-42" y="38" width="84" height="18" rx="9" fill="#FF0033" fill-opacity="0.2" stroke="#FF0033" stroke-width="1"/>
    <text x="0" y="51" font-family="Roboto, sans-serif" font-size="9" font-weight="700" fill="#FF0033" text-anchor="middle" letter-spacing="2">
      CREATOR
    </text>
  </g>
</svg>
