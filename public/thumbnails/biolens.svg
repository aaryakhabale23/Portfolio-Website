<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a12"/>
      <stop offset="40%" stop-color="#0c291c"/>
      <stop offset="100%" stop-color="#050d0a"/>
    </linearGradient>
    <radialGradient id="bioGlow" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bioBg)"/>
  <circle cx="850" cy="360" r="450" fill="url(#bioGlow)"/>

  <!-- Botanical Specimen Visualization (Stylized Foliage) -->
  <g transform="translate(680, 100)" opacity="0.85">
    <!-- Leaf veins and shapes -->
    <path d="M 280 480 C 150 350, 100 200, 240 60 C 380 200, 360 350, 280 480 Z" fill="#064e3b" stroke="#10b981" stroke-width="3" opacity="0.7"/>
    <path d="M 240 60 L 280 480" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M 255 180 Q 200 160 170 190" stroke="#34d399" stroke-width="2" fill="none"/>
    <path d="M 265 260 Q 330 240 350 270" stroke="#34d399" stroke-width="2" fill="none"/>
    <path d="M 270 340 Q 210 320 180 350" stroke="#34d399" stroke-width="2" fill="none"/>

    <!-- Neural Computer Vision Bounding Box -->
    <rect x="80" y="30" width="380" height="480" rx="8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8 4"/>
    <!-- Corner brackets -->
    <path d="M 80 70 L 80 30 L 120 30" fill="none" stroke="#34d399" stroke-width="6"/>
    <path d="M 420 30 L 460 30 L 460 70" fill="none" stroke="#34d399" stroke-width="6"/>
    <path d="M 80 470 L 80 510 L 120 510" fill="none" stroke="#34d399" stroke-width="6"/>
    <path d="M 420 510 L 460 510 L 460 470" fill="none" stroke="#34d399" stroke-width="6"/>

    <!-- Detection Meta Label -->
    <rect x="90" y="40" width="220" height="34" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="110" cy="57" r="5" fill="#10b981"/>
    <text x="125" y="62" font-family="monospace" font-size="14" font-weight="700" fill="#a7f3d0">SPECIES: F. RELIGIOSA</text>

    <!-- Confidence Gauge Overlay -->
    <rect x="90" y="450" width="180" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="105" y="470" font-family="Roboto, sans-serif" font-size="12" fill="#94a3b8">CONFIDENCE</text>
    <text x="105" y="487" font-family="Roboto, sans-serif" font-size="16" font-weight="900" fill="#34d399">99.2% [SUB-120ms]</text>
  </g>

  <!-- Left Side: Bold YouTube Title Typography -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="40" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" font-family="Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399" letter-spacing="2">
      ⚡ OFFLINE TFLITE AI
    </text>

    <!-- Main Thumbnail Headline -->
    <text x="0" y="120" font-family="Roboto, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      IDENTIFYING
    </text>
    <text x="0" y="210" font-family="Roboto, -apple-system, sans-serif" font-size="88" font-weight="900" fill="#34d399" letter-spacing="1">
      1,081 SPECIES
    </text>
    <text x="0" y="295" font-family="Roboto, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      — OFFLINE
    </text>

    <!-- Subtitle metadata -->
    <rect x="0" y="340" width="460" height="48" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="371" font-family="Roboto, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">
      Sub-120ms • React Native • Zero Internet
    </text>
  </g>

  <!-- Watermark logo -->
  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#10b981" opacity="0.6" text-anchor="end">
    BIOLENS PLATFORM
  </text>
</svg>
