<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="birdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19150a"/>
      <stop offset="50%" stop-color="#2d220b"/>
      <stop offset="100%" stop-color="#120c05"/>
    </linearGradient>
    <radialGradient id="birdGlow" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#birdBg)"/>
  <circle cx="860" cy="360" r="460" fill="url(#birdGlow)"/>

  <!-- Bird Detection Visual & FastAPI REST Architecture -->
  <g transform="translate(680, 100)">
    <!-- API Diagram Container -->
    <rect x="0" y="0" width="500" height="480" rx="20" fill="#1b170f" stroke="#45381a" stroke-width="2"/>
    
    <!-- Code Header -->
    <rect x="0" y="0" width="500" height="45" rx="20" fill="#241e12"/>
    <circle cx="30" cy="22" r="6" fill="#ef4444"/>
    <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="22" r="6" fill="#10b981"/>
    <text x="100" y="27" font-family="monospace" font-size="13" fill="#d97706">fastapi_server.py [POST /api/v1/infer/bird]</text>

    <!-- Architecture flow nodes -->
    <g transform="translate(30, 75)">
      <!-- Node 1: Client Payload -->
      <rect x="0" y="0" width="120" height="70" rx="8" fill="#2a2215" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="60" y="32" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">CLIENT</text>
      <text x="60" y="52" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">Image / Audio</text>

      <line x1="120" y1="35" x2="160" y2="35" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

      <!-- Node 2: FastAPI Gateway -->
      <rect x="160" y="0" width="120" height="70" rx="8" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5"/>
      <text x="220" y="32" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">FASTAPI</text>
      <text x="220" y="52" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Pydantic Valid</text>

      <line x1="280" y1="35" x2="320" y2="35" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

      <!-- Node 3: AWS S3 Bucket -->
      <rect x="320" y="0" width="120" height="70" rx="8" fill="#c2410c" fill-opacity="0.25" stroke="#f97316" stroke-width="1.5"/>
      <text x="380" y="32" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">AWS S3</text>
      <text x="380" y="52" font-family="monospace" font-size="10" fill="#fed7aa" text-anchor="middle">Presigned URLs</text>
    </g>

    <!-- Neural Avian Detection Simulation -->
    <g transform="translate(30, 180)">
      <rect x="0" y="0" width="440" height="250" rx="12" fill="#0f0d09" stroke="#332a18" stroke-width="1"/>
      <!-- Bird silhouette / detection frame -->
      <circle cx="220" cy="110" r="60" fill="#292011" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Flight path vectors -->
      <path d="M 180 120 Q 220 80 260 120" stroke="#fbbf24" stroke-width="3" fill="none"/>
      <text x="220" y="115" font-family="monospace" font-size="12" fill="#fde68a" text-anchor="middle">AVIAN BIO-ACOUSTIC</text>
      
      <!-- Prediction result banner -->
      <rect x="20" y="190" width="400" height="45" rx="6" fill="#241c0e" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="35" y="218" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#fef08a">Pavo cristatus (Indian Peafowl) • 96.7% CONF</text>
    </g>
  </g>

  <!-- Left Side: Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="38" rx="6" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#fde68a" letter-spacing="2">
      ⚡ FASTAPI + ML + AWS S3
    </text>

    <text x="0" y="115" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      TURNING
    </text>
    <text x="0" y="210" font-family="Roboto, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#fbbf24" letter-spacing="1">
      MACHINE LEARNING
    </text>
    <text x="0" y="305" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      INTO AN API
    </text>

    <rect x="0" y="350" width="480" height="50" rx="8" fill="#1b170f" stroke="#45381a" stroke-width="1.5"/>
    <text x="20" y="382" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#fef08a">
      Low Latency Microservice • Postman • Jest
    </text>
  </g>

  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#fbbf24" opacity="0.6" text-anchor="end">
    BIRD INFERENCE MICROSERVICE
  </text>
</svg>
