<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="darBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a10"/>
      <stop offset="50%" stop-color="#24301a"/>
      <stop offset="100%" stop-color="#0a1008"/>
    </linearGradient>
    <radialGradient id="darGlow" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#darBg)"/>
  <circle cx="860" cy="360" r="460" fill="url(#darGlow)"/>

  <!-- 3 Interconnected Feature Mockups -->
  <g transform="translate(620, 110)">
    <!-- Feature 1: User-Guided Flow -->
    <g transform="translate(0, 40)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="320" rx="16" fill="#181e13" stroke="#84cc16" stroke-width="2"/>
      <rect x="15" y="20" width="80" height="10" rx="3" fill="#bef264"/>
      <circle cx="90" cy="80" r="28" fill="#84cc16" fill-opacity="0.2" stroke="#84cc16" stroke-width="1.5"/>
      <text x="90" y="86" font-family="Roboto, sans-serif" font-size="14" font-weight="900" fill="#a3e635" text-anchor="middle">STEP 1</text>
      <rect x="20" y="130" width="140" height="8" rx="2" fill="#3f4a34"/>
      <rect x="20" y="150" width="110" height="8" rx="2" fill="#3f4a34"/>
      <rect x="20" y="170" width="130" height="8" rx="2" fill="#3f4a34"/>
      <rect x="20" y="240" width="140" height="36" rx="8" fill="#84cc16"/>
      <text x="90" y="263" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#141a10" text-anchor="middle">CONTINUE →</text>
    </g>

    <!-- Connecting line 1 -> 2 -->
    <line x1="180" y1="200" x2="220" y2="170" stroke="#84cc16" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Feature 2: Plant Identification -->
    <g transform="translate(220, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="190" height="340" rx="16" fill="#181e13" stroke="#a3e635" stroke-width="2"/>
      <!-- Camera scan view -->
      <rect x="15" y="15" width="160" height="160" rx="10" fill="#0f140c" stroke="#365314" stroke-width="1"/>
      <circle cx="95" cy="95" r="45" fill="none" stroke="#bef264" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="95" y="100" font-family="monospace" font-size="11" fill="#bef264" text-anchor="middle">SPECIES MATCH</text>
      <rect x="20" y="190" width="150" height="24" rx="4" fill="#365314"/>
      <text x="95" y="206" font-family="Roboto, sans-serif" font-size="11" font-weight="700" fill="#ecfccb" text-anchor="middle">Tectona Grandis (Teak)</text>
      <rect x="20" y="225" width="150" height="60" rx="6" fill="#13190e"/>
      <text x="30" y="245" font-family="Roboto, sans-serif" font-size="10" fill="#a3e635">Confidence: 98.4%</text>
      <text x="30" y="265" font-family="Roboto, sans-serif" font-size="10" fill="#d9f99d">Crown Density: High</text>
    </g>

    <!-- Connecting line 2 -> 3 -->
    <line x1="410" y1="170" x2="450" y2="200" stroke="#84cc16" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Feature 3: Tree DBH Measurement -->
    <g transform="translate(450, 40)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="320" rx="16" fill="#181e13" stroke="#84cc16" stroke-width="2"/>
      <text x="90" y="40" font-family="Roboto, sans-serif" font-size="12" font-weight="800" fill="#a3e635" text-anchor="middle">TREE DBH CALC</text>
      <!-- Trunk circumference visual -->
      <circle cx="90" cy="110" r="40" fill="#2d3b1e" stroke="#bef264" stroke-width="2.5"/>
      <line x1="50" y1="110" x2="130" y2="110" stroke="#bef264" stroke-width="2"/>
      <text x="90" y="135" font-family="monospace" font-size="12" font-weight="900" fill="#ecfccb" text-anchor="middle">Ø 48.6 cm</text>
      <rect x="20" y="180" width="140" height="40" rx="6" fill="#1a2412"/>
      <text x="30" y="205" font-family="Roboto, sans-serif" font-size="11" fill="#bef264">Biomass Est: 1.4T</text>
    </g>
  </g>

  <!-- Left Side: Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="320" height="38" rx="6" fill="#84cc16" fill-opacity="0.25" stroke="#bef264" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#d9f99d" letter-spacing="2">
      🌱 DARUKAA.EARTH INTERNSHIP
    </text>

    <text x="0" y="115" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      3 FEATURES.
    </text>
    <text x="0" y="210" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#a3e635" letter-spacing="1">
      END-TO-END
    </text>
    <text x="0" y="305" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      OWNERSHIP.
    </text>

    <rect x="0" y="350" width="490" height="50" rx="8" fill="#181e13" stroke="#3f4a34" stroke-width="1.5"/>
    <text x="20" y="382" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#ecfccb">
      Guided Flow • Plant ID • Tree DBH Measurement
    </text>
  </g>

  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#bef264" opacity="0.6" text-anchor="end">
    PRODUCT ENGINEERING CASE STUDY
  </text>
</svg>
