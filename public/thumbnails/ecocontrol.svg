<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#0f2038"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <radialGradient id="ecoGlow" cx="70%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ecoBg)"/>
  <circle cx="850" cy="360" r="460" fill="url(#ecoGlow)"/>

  <!-- Smart Building Schematic + CV Bounding Boxes -->
  <g transform="translate(680, 90)" opacity="0.85">
    <!-- Building wireframe blocks -->
    <rect x="60" y="80" width="460" height="460" fill="#0b172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Floor grid lines -->
    <line x1="60" y1="200" x2="520" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="60" y1="320" x2="520" y2="320" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="60" y1="440" x2="520" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- CV Bounding Boxes (Zone 1) -->
    <rect x="90" y="100" width="160" height="85" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="125" font-family="monospace" font-size="12" fill="#38bdf8">OCCUPANTS: 14</text>
    <text x="100" y="150" font-family="monospace" font-size="14" font-weight="700" fill="#f0f9ff">HVAC: 68% OPT</text>

    <!-- CV Bounding Boxes (Zone 2) -->
    <rect x="300" y="220" width="190" height="85" fill="#e11d48" fill-opacity="0.2" stroke="#f43f5e" stroke-width="2"/>
    <text x="310" y="245" font-family="monospace" font-size="12" fill="#f43f5e">ZONE IDLE [0]</text>
    <text x="310" y="270" font-family="monospace" font-size="14" font-weight="700" fill="#ffe4e6">POWER CUT: 100%</text>

    <!-- Central Gauge Card -->
    <g transform="translate(140, 340)">
      <rect x="0" y="0" width="280" height="160" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <text x="20" y="36" font-family="Roboto, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc" letter-spacing="1">PPO RL AGENT METRICS</text>
      <text x="20" y="90" font-family="Roboto, sans-serif" font-size="52" font-weight="900" fill="#38bdf8">-76.8%</text>
      <text x="20" y="130" font-family="Roboto, sans-serif" font-size="14" fill="#bae6fd">81%+ Occupant Comfort Preserved</text>
    </g>
  </g>

  <!-- Left Side: Bold Thumbnail Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Simulated Badge -->
    <rect x="0" y="0" width="310" height="38" rx="6" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#fb7185" letter-spacing="2">
      ⚠ SIMULATED BENCHMARK
    </text>

    <text x="0" y="110" font-family="Roboto, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      CAN AI REDUCE
    </text>
    <text x="0" y="195" font-family="Roboto, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      ENERGY USAGE
    </text>
    <text x="0" y="295" font-family="Roboto, -apple-system, sans-serif" font-size="105" font-weight="900" fill="#38bdf8" letter-spacing="1">
      BY 76.8%?
    </text>

    <rect x="0" y="340" width="460" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="372" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">
      YOLOv8 + Dilated CNN + PPO Agent
    </text>
  </g>

  <!-- Bottom watermark -->
  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#38bdf8" opacity="0.6" text-anchor="end">
    ECOCONTROL INTELLIGENCE
  </text>
</svg>
