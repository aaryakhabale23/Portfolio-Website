<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="gdgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1829"/>
      <stop offset="50%" stop-color="#142642"/>
      <stop offset="100%" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="gdgGlow" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#gdgBg)"/>
  <circle cx="860" cy="360" r="460" fill="url(#gdgGlow)"/>

  <!-- Google 4-Color Accents & Community Stage Visual -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="480" height="460" rx="18" fill="#131e33" stroke="#253554" stroke-width="2"/>
    
    <!-- GDG Colors Top Bar -->
    <rect x="0" y="0" width="120" height="8" rx="4" fill="#EA4335"/>
    <rect x="120" y="0" width="120" height="8" rx="4" fill="#4285F4"/>
    <rect x="240" y="0" width="120" height="8" rx="4" fill="#34A853"/>
    <rect x="360" y="0" width="120" height="8" rx="4" fill="#FBBC04"/>

    <!-- HackX 24H Hackathon Banner -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="420" height="150" rx="12" fill="#1e2c47" stroke="#4285F4" stroke-width="1.5"/>
      <text x="30" y="50" font-family="Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff">HackX '25</text>
      <text x="30" y="80" font-family="Roboto, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">FLAGSHIP 24-HOUR HACKATHON</text>
      <line x1="30" y1="100" x2="390" y2="100" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <text x="30" y="125" font-family="monospace" font-size="13" font-weight="700" fill="#6ee7b7">600+ HACKERS • 50+ TEAMS • ₹2L+ SPONSORSHIPS</text>
    </g>

    <!-- Community Stats Grid -->
    <g transform="translate(30, 220)">
      <rect x="0" y="0" width="200" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="38" font-family="Roboto, sans-serif" font-size="32" font-weight="900" fill="#4285F4">350+</text>
      <text x="20" y="65" font-family="Roboto, sans-serif" font-size="12" fill="#94a3b8">Active Members</text>

      <rect x="220" y="0" width="200" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="240" y="38" font-family="Roboto, sans-serif" font-size="32" font-weight="900" fill="#34A853">25</text>
      <text x="240" y="65" font-family="Roboto, sans-serif" font-size="12" fill="#94a3b8">Organizing Committee</text>
    </g>

    <g transform="translate(30, 330)">
      <rect x="0" y="0" width="420" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="38" font-family="Roboto, sans-serif" font-size="30" font-weight="900" fill="#FBBC04">₹2 Lakh+</text>
      <text x="20" y="65" font-family="Roboto, sans-serif" font-size="13" fill="#cbd5e1">Raised in Corporate &amp; Educational Sponsorships</text>
    </g>
  </g>

  <!-- Left Side: Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="6" fill="#4285F4" fill-opacity="0.25" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#bfdbfe" letter-spacing="2">
      🌐 GDG ON CAMPUS LEAD
    </text>

    <text x="0" y="115" font-family="Roboto, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      BUILDING A TECH
    </text>
    <text x="0" y="210" font-family="Roboto, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#93c5fd" letter-spacing="1">
      COMMUNITY FROM
    </text>
    <text x="0" y="305" font-family="Roboto, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      THE GROUND UP
    </text>

    <rect x="0" y="350" width="480" height="50" rx="8" fill="#131e33" stroke="#253554" stroke-width="1.5"/>
    <text x="20" y="382" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">
      25-Member Team • HackX • 350+ Developers
    </text>
  </g>

  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#93c5fd" opacity="0.6" text-anchor="end">
    LEADERSHIP &amp; COMMUNITY HIGHLIGHT
  </text>
</svg>
