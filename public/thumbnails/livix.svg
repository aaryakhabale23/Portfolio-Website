<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="livBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="50%" stop-color="#221745"/>
      <stop offset="100%" stop-color="#0a0717"/>
    </linearGradient>
    <radialGradient id="livGlow" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#livBg)"/>
  <circle cx="860" cy="360" r="460" fill="url(#livGlow)"/>

  <!-- Modern Android Smartphone Mockup with Society Dashboard -->
  <g transform="translate(740, 60)" filter="url(#shadow)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="280" height="580" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
    <!-- Phone Screen -->
    <rect x="12" y="16" width="256" height="548" rx="26" fill="#09090b"/>
    <!-- Camera Notch -->
    <circle cx="140" cy="34" r="8" fill="#18181b"/>

    <!-- App Header -->
    <rect x="24" y="60" width="110" height="14" rx="4" fill="#a78bfa"/>
    <circle cx="240" cy="67" r="10" fill="#27272a"/>

    <!-- Screen Content: Gate Pass QR Card -->
    <rect x="24" y="90" width="232" height="150" rx="14" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="40" y="116" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">VISITOR PASS • ENTRY APPROVED</text>
    <!-- Stylized QR Code -->
    <rect x="40" y="130" width="70" height="70" rx="6" fill="#ffffff"/>
    <rect x="48" y="138" width="20" height="20" fill="#000000"/>
    <rect x="82" y="138" width="20" height="20" fill="#000000"/>
    <rect x="48" y="172" width="20" height="20" fill="#000000"/>
    <rect x="76" y="168" width="12" height="12" fill="#000000"/>
    <text x="124" y="155" font-family="Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Alex Morgan</text>
    <text x="124" y="175" font-family="Roboto, sans-serif" font-size="11" fill="#a78bfa">Tower B - 1402</text>
    <text x="124" y="195" font-family="monospace" font-size="10" fill="#6ee7b7">VALID: 4H 30M</text>

    <!-- Amenity Booking Grid (2x2 mini cards) -->
    <rect x="24" y="260" width="110" height="75" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="36" y="285" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#e4e4e7">Clubhouse</text>
    <text x="36" y="305" font-family="Roboto, sans-serif" font-size="10" fill="#22c55e">Available</text>

    <rect x="146" y="260" width="110" height="75" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="158" y="285" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#e4e4e7">Tennis Court</text>
    <text x="158" y="305" font-family="Roboto, sans-serif" font-size="10" fill="#f59e0b">Booked</text>

    <!-- Complaint Module Card -->
    <rect x="24" y="350" width="232" height="60" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="36" y="375" font-family="Roboto, sans-serif" font-size="11" font-weight="700" fill="#e4e4e7">Plumbing Issue #481</text>
    <text x="36" y="395" font-family="Roboto, sans-serif" font-size="10" fill="#38bdf8">Status: In Progress</text>

    <!-- Bottom Navigation Bar on Phone -->
    <rect x="12" y="510" width="256" height="54" fill="#18181b"/>
    <circle cx="50" cy="535" r="8" fill="#8b5cf6"/>
    <circle cx="100" cy="535" r="8" fill="#52525b"/>
    <circle cx="150" cy="535" r="8" fill="#52525b"/>
    <circle cx="200" cy="535" r="8" fill="#52525b"/>
  </g>

  <!-- Left Side: Bold Thumbnail Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="240" height="38" rx="6" fill="#8b5cf6" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#c4b5fd" letter-spacing="2">
      📱 ANDROID + FIREBASE
    </text>

    <text x="0" y="115" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      ONE APP.
    </text>
    <text x="0" y="205" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#a78bfa" letter-spacing="1">
      11 SCREENS.
    </text>
    <text x="0" y="295" font-family="Roboto, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      6 CORE MODULES.
    </text>

    <rect x="0" y="340" width="480" height="50" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="20" y="372" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#f4f4f5">
      Cloud Firestore • ZXing QR • Multi-Role RBAC
    </text>
  </g>

  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#a78bfa" opacity="0.6" text-anchor="end">
    LIVIX SMART COMMUNITY
  </text>
</svg>
