<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="prdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1214"/>
      <stop offset="50%" stop-color="#30151a"/>
      <stop offset="100%" stop-color="#120a0b"/>
    </linearGradient>
    <radialGradient id="prdGlow" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#prdBg)"/>
  <circle cx="860" cy="360" r="460" fill="url(#prdGlow)"/>

  <!-- Split Screen: PRD Document + Figma Wireframes + Roadmap -->
  <g transform="translate(640, 90)">
    <!-- PRD Document View (Left Card) -->
    <g transform="translate(0, 30)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="420" rx="14" fill="#1e1819" stroke="#fb7185" stroke-width="2"/>
      <rect x="20" y="24" width="90" height="12" rx="3" fill="#f43f5e"/>
      <text x="20" y="65" font-family="Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">PRD: Feature 2.0</text>
      <!-- PRD Lines -->
      <rect x="20" y="90" width="180" height="8" rx="2" fill="#52393d"/>
      <rect x="20" y="110" width="220" height="8" rx="2" fill="#52393d"/>
      <rect x="20" y="130" width="160" height="8" rx="2" fill="#52393d"/>
      <!-- Acceptance Criteria box -->
      <rect x="20" y="160" width="220" height="90" rx="8" fill="#2d1d20" stroke="#f43f5e" stroke-width="1"/>
      <text x="32" y="185" font-family="monospace" font-size="11" font-weight="700" fill="#fda4af">ACCEPTANCE CRITERIA</text>
      <text x="32" y="210" font-family="Roboto, sans-serif" font-size="11" fill="#e2e8f0">✓ Offline sync resilience</text>
      <text x="32" y="230" font-family="Roboto, sans-serif" font-size="11" fill="#e2e8f0">✓ P95 latency &lt; 150ms</text>
      <!-- RICE Score Tag -->
      <rect x="20" y="270" width="140" height="30" rx="6" fill="#881337"/>
      <text x="30" y="290" font-family="monospace" font-size="11" font-weight="700" fill="#fecdd3">RICE SCORE: 88.5</text>
      <!-- Roadmap Gantt snippet -->
      <rect x="20" y="320" width="220" height="70" rx="6" fill="#140f10"/>
      <rect x="30" y="340" width="80" height="12" rx="4" fill="#38bdf8"/>
      <rect x="120" y="360" width="100" height="12" rx="4" fill="#10b981"/>
    </g>

    <!-- Figma Wireframes (Right Card) -->
    <g transform="translate(290, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="280" height="460" rx="14" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
      <rect x="20" y="20" width="110" height="14" rx="4" fill="#0284c7"/>
      <text x="20" y="60" font-family="Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Figma Wireframe Canvas</text>
      
      <!-- Screen 1 wireframe -->
      <rect x="20" y="80" width="110" height="160" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <circle cx="75" cy="115" r="16" fill="#38bdf8" fill-opacity="0.3"/>
      <rect x="30" y="145" width="90" height="8" rx="2" fill="#71717a"/>
      <rect x="30" y="160" width="70" height="8" rx="2" fill="#71717a"/>
      <rect x="30" y="200" width="90" height="20" rx="4" fill="#38bdf8"/>

      <!-- Screen 2 wireframe -->
      <rect x="150" y="80" width="110" height="160" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
      <rect x="160" y="95" width="90" height="25" rx="4" fill="#10b981" fill-opacity="0.3"/>
      <rect x="160" y="130" width="90" height="8" rx="2" fill="#71717a"/>
      <rect x="160" y="145" width="70" height="8" rx="2" fill="#71717a"/>
      <rect x="160" y="200" width="90" height="20" rx="4" fill="#10b981"/>

      <!-- Connecting User Journey Arrow -->
      <path d="M 130 160 L 150 160" stroke="#f43f5e" stroke-width="3" stroke-dasharray="3 3"/>

      <!-- Component Token Shelf -->
      <rect x="20" y="260" width="240" height="80" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
      <text x="32" y="285" font-family="monospace" font-size="11" fill="#fde047">DESIGN TOKENS</text>
      <circle cx="40" cy="310" r="10" fill="#f43f5e"/>
      <circle cx="70" cy="310" r="10" fill="#38bdf8"/>
      <circle cx="100" cy="310" r="10" fill="#10b981"/>
      <circle cx="130" cy="310" r="10" fill="#f59e0b"/>

      <!-- RAG Chatbot Integration Badge -->
      <rect x="20" y="360" width="240" height="70" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
      <text x="32" y="388" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#fecdd3">RAG Internal Chatbot</text>
      <text x="32" y="410" font-family="Roboto, sans-serif" font-size="11" fill="#fda4af">AI-assisted feature discovery</text>
    </g>
  </g>

  <!-- Left Side: Headline -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="290" height="38" rx="6" fill="#f43f5e" fill-opacity="0.25" stroke="#fb7185" stroke-width="1.5"/>
    <text x="16" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="800" fill="#fda4af" letter-spacing="2">
      📐 PRODUCT MANAGEMENT
    </text>

    <text x="0" y="115" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      FROM PRDs
    </text>
    <text x="0" y="210" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#fb7185" letter-spacing="1">
      TO FIGMA
    </text>
    <text x="0" y="305" font-family="Roboto, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      TO PRODUCTION
    </text>

    <rect x="0" y="350" width="480" height="50" rx="8" fill="#1e1819" stroke="#52393d" stroke-width="1.5"/>
    <text x="20" y="382" font-family="Roboto, sans-serif" font-size="17" font-weight="700" fill="#fda4af">
      User Journeys • RICE Prioritization • Roadmaps
    </text>
  </g>

  <text x="1200" y="670" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#fb7185" opacity="0.6" text-anchor="end">
    PRODUCT ARTIFACTS SHOWCASE
  </text>
</svg>
