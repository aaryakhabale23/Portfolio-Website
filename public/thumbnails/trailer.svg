<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e12"/>
      <stop offset="50%" stop-color="#281119"/>
      <stop offset="100%" stop-color="#0c0709"/>
    </linearGradient>
    <radialGradient id="trGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#trBg)"/>
  <circle cx="640" cy="360" r="500" fill="url(#trGlow)"/>

  <!-- Background decorative grid -->
  <g opacity="0.15">
    <line x1="0" y1="180" x2="1280" y2="180" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="720" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="720" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="720" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Big Central Play Button Visual -->
  <g transform="translate(640, 260)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="90" fill="#FF0033" fill-opacity="0.9"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#FF0033" stroke-width="3" opacity="0.5"/>
    <polygon points="-24,-36 44,0 -24,36" fill="#FFFFFF"/>
  </g>

  <!-- Title & Subtitle Below -->
  <g transform="translate(640, 430)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-180" y="-30" width="360" height="34" rx="17" fill="#FF0033" fill-opacity="0.2" stroke="#FF0033" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="Roboto, sans-serif" font-size="13" font-weight="900" fill="#FF0033" letter-spacing="4">
      • CHANNEL TRAILER •
    </text>

    <text x="0" y="55" font-family="Roboto, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      GET TO KNOW AARYA
    </text>
    
    <text x="0" y="105" font-family="Roboto, sans-serif" font-size="20" font-weight="500" fill="#d1d5db" letter-spacing="1">
      "An introduction to what I build, how I think, and what I'm exploring."
    </text>

    <!-- 4 Pillar Chips -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" font-family="monospace" font-size="15" fill="#f87171" letter-spacing="3">
        PRODUCT  |  AI  |  ENGINEERING  |  LEADERSHIP
      </text>
    </g>
  </g>
</svg>
